name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare build environment
        run: |
          python3 -m venv .pages-venv
          .pages-venv/bin/python -m pip install "beautifulsoup4>=4.13,<5"
      - name: Test Pages output
        run: .pages-venv/bin/python -m unittest tests.test_github_pages
      - name: Build public artifact
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          .pages-venv/bin/python scripts/build_github_pages.py \
            --base-url "${PAGES_BASE_URL:-https://riemenschneider2015-svg.github.io/linguoai-de/}" \
            --output-dir _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
